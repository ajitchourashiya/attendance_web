<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(135deg, #e0f2ff, #b3e5fc, #81d4fa);
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* floating blobs */
    .blob {
        position: absolute;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.5;
        z-index: 0;
    }

    .blob1 {
        background: #3b82f6;
        top: -50px;
        left: -50px;
    }

    .blob2 {
        background: #8b5cf6;
        bottom: -50px;
        right: -50px;
    }

    /* login card */
    .login-card {
        width: 100%;
        max-width: 380px;
        padding: 30px;
        border-radius: 20px;

        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);

        box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        z-index: 2;
    }

    /* logo wrapper */
    .logo-box {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 10px;
    }

    /* FIXED LOGO */
    .logo {
        max-width: 180px;
        width: 100%;
        height: auto;
        object-fit: contain;
        border-radius: 10px;
    }

    .title {
        text-align: center;
        font-weight: bold;
        color: rgb(20, 176, 238);
        margin-top: 10px;
    }

    label {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 5px;
    }

    .form-control {
        border-radius: 12px;
        padding: 12px;
        background: #f1f7ff;
        border: none;
    }

    .form-control:focus {
        box-shadow: none;
        border: 1px solid #3b82f6;
    }

    .btn-login {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        background: #2563eb;
        border: none;
        font-weight: bold;
    }

    .btn-login:hover {
        background: #1d4ed8;
    }

    /* responsive */
    @media (max-width: 480px) {
        .login-card {
            margin: 20px;
        }

        .logo {
            max-width: 140px;
        }
    }
</style>

</head>

<body>

<!-- background blobs -->
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<!-- login card -->
<div class="login-card">

    <!-- LOGO -->
    <div class="logo-box">
        <img src="https://dacnis.in/wp-content/uploads/2023/02/DACNIS.png"
             class="logo"
             alt="Logo">
    </div>

    <h4 class="title">Attendance Portal</h4>

    <form action="/login" method="post">

        <div class="mt-4">
            <label>Mobile Number</label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   placeholder="Enter mobile">
        </div>

        <div class="mt-3">
            <label>Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password">
        </div>

        <button type="submit"
                class="btn btn-primary btn-login mt-4">
            LOGIN
        </button>

    </form>

</div>

</body>
</html>
